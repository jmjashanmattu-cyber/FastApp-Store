<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store UI</title>
  <style>
    /* Reset & Base Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19; /* Deep Obsidian Blue Background */
      color: #f8fafc;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 90px; /* Space for bottom nav bar */
    }

    /* Ambient Background Glow Effects */
    .bg-glow-1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      top: 35%;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(0,0,0,0) 70%);
      filter: blur(90px);
      z-index: 0;
    }

    /* Main Container */
    .app-store-container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Search Box Wrapper */
    .search-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 2rem;
    }

    /* Premium Search Bar Styling */
    .search-box {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.05); /* Frosted glass effect */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 0.85rem 1.25rem 0.85rem 3.2rem;
      display: flex;
      align-items: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.5); /* Cyan Glow on Focus */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.2);
    }

    /* Search Icon */
    .search-icon {
      position: absolute;
      left: 1.2rem;
      width: 20px;
      height: 20px;
      stroke: #94a3b8;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* Input Field */
    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 400;
    }

    .search-input::placeholder {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* Dynamic Search Results Box */
    .search-results {
      margin-top: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Search Result Item */
    .result-item {
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: rgba(56, 189, 248, 0.12);
    }

    .app-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .app-details h4 {
      font-size: 0.95rem;
      color: #f8fafc;
      margin-bottom: 2px;
    }

    .app-details p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .no-results {
      padding: 1rem;
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    /* Home Feed Content Container */
    .home-content {
      margin-top: 1.5rem;
    }

    .home-content h3 {
      font-size: 1.2rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .home-content p {
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      border: none;
      outline: none;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke: #64748b;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.25s ease;
    }

    /* Active State for Navigation Buttons */
    .nav-btn.active {
      color: #38bdf8;
    }

    .nav-btn.active svg {
      stroke: #38bdf8;
      transform: translateY(-2px);
    }

    .nav-btn:hover {
      color: #f8fafc;
    }

    .nav-btn:hover svg {
      stroke: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Background Glow Elements -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Main Store View -->
  <div class="app-store-container">
    
    <!-- Search Section -->
    <div class="search-wrapper">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search for apps & games..." />
      </div>

      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Home Page Content Placeholder -->
    <div id="homeView" class="home-content">
      <h3>Welcome to App Store</h3>
      <p>Use the search bar above or tap icons below to navigate.</p>
    </div>

  </div>

  <!-- Bottom Navigation Bar with Functional Buttons -->
  <nav class="bottom-nav">
    <!-- Left Bottom Corner: Home Button -->
    <button class="nav-btn active" id="homeBtn" onclick="goToHome()">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </button>

    <!-- Right Bottom Corner: Search/Explore Button -->
    <button class="nav-btn" id="searchBtn" onclick="focusSearch()">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search</span>
    </button>
  </nav>

  <script>
    // 1. DATA FILE / DATABASE
    const appsData = [
      { id: 1, name: "MS Player Pro", category: "Video & Media", iconText: "MS" },
      { id: 2, name: "Live TV Stream", category: "Entertainment", iconText: "TV" },
      { id: 3, name: "Photo Editor 4K", category: "Photography", iconText: "PE" },
      { id: 4, name: "Cinema Hub", category: "Movies & Shows", iconText: "CH" },
      { id: 5, name: "Music Studio", category: "Audio", iconText: "MS" }
    ];

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const homeBtn = document.getElementById('homeBtn');
    const searchBtn = document.getElementById('searchBtn');

    // 2. SEARCH SYSTEM
    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      
      if (query === '') {
        searchResults.style.display = 'none';
        searchResults.innerHTML = '';
        return;
      }

      const filteredApps = appsData.filter(app => 
        app.name.toLowerCase().includes(query) || 
        app.category.toLowerCase().includes(query)
      );

      renderResults(filteredApps);
    });

    function renderResults(results) {
      if (results.length === 0) {
        searchResults.innerHTML = `<div class="no-results">No apps found</div>`;
      } else {
        searchResults.innerHTML = results.map(app => `
          <div class="result-item">
            <div class="app-icon">${app.iconText}</div>
            <div class="app-details">
              <h4>${app.name}</h4>
              <p>${app.category}</p>
            </div>
          </div>
        `).join('');
      }
      searchResults.style.display = 'block';
    }

    // 3. NAVIGATION FUNCTIONALITY (ACTIVE WORKING BUTTONS)

    // Function: Home Button Click Handler
    function goToHome() {
      // Clear Search Input & Close Search Overlay
      searchInput.value = '';
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
      
      // Update Button Active Highlights
      homeBtn.classList.add('active');
      searchBtn.classList.remove('active');

      // Scroll smoothly to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Function: Right Corner Search Button Click Handler
    function focusSearch() {
      // Focus cursor inside search input
      searchInput.focus();

      // Update Button Active Highlights
      searchBtn.classList.add('active');
      homeBtn.classList.remove('active');
    }
  </script>

</body>
          </html>
