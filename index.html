<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store UI</title>
  <style>
    /* Reset & Base Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19; /* Deep Obsidian Blue Background */
      color: #f8fafc;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow Effects */
    .bg-glow-1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      top: 35%;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(0,0,0,0) 70%);
      filter: blur(90px);
      z-index: 0;
    }

    /* Main Container */
    .app-store-container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Premium Search Bar Styling */
    .search-box {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.05); /* Frosted glass effect */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 0.85rem 1.25rem 0.85rem 3.2rem;
      display: flex;
      align-items: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.5); /* Cyan Glow on Focus */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.2);
    }

    /* Search Icon */
    .search-icon {
      position: absolute;
      left: 1.2rem;
      width: 20px;
      height: 20px;
      stroke: #94a3b8;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* Input Field */
    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 400;
    }

    .search-input::placeholder {
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Background Glow Elements -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Store Interface -->
  <div class="app-store-container">
    <!-- Premium Search Bar -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" placeholder="Search for apps & games..." />
    </div>
  </div>

</body>
</html>
